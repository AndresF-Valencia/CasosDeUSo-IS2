spring.application.name=CasosDeUso



#Cambien  los parametros del host, nombre y constraseña de la BD
# Configuración de conexión a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/casosdeuso
spring.datasource.username=postgres
spring.datasource.password=1234567
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate: Recrea las tablas al iniciar y las borra al cerrar (ideal para pruebas)
spring.jpa.hibernate.ddl-auto=create-drop

# Mostrar consultas SQL en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cargar el archivo data.sql o import.sql después de crear las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always